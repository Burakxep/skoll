<style>
  .runbar { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .runbar select { height: 44px; padding: 0 10px; border-radius: 12px; max-width: 140px;
    border: 1px solid var(--border); background: var(--surface); font-size: 14px; cursor: pointer; }
  .runbar select:hover { border-color: var(--sun); }
  /* split Run button: primary = normal run, caret = Run / Dry run menu */
  .runsplit { position: relative; display: inline-flex; }
  .runsplit .run { height: 44px; padding: 0 18px; border: 1px solid var(--sun);
    border-radius: 12px 0 0 12px; background: var(--sun); color: var(--on-sun);
    font-size: 14px; font-weight: 600; cursor: pointer; }
  .runsplit .run-caret { height: 44px; width: 40px; border: 1px solid var(--sun);
    border-left-color: rgba(0, 0, 0, .18); border-radius: 0 12px 12px 0;
    background: var(--sun); color: var(--on-sun); font-size: 13px; cursor: pointer; }
  .runsplit .run:disabled, .runsplit .run-caret:disabled { opacity: .55; cursor: default; }
  .runsplit .run:focus-visible, .runsplit .run-caret:focus-visible {
    outline: 2px solid var(--fg); outline-offset: 2px; }
  .run-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 200px;
    padding: 6px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 12px 34px rgba(0, 0, 0, .35); display: flex; flex-direction: column; gap: 2px; }
  .run-menu[hidden] { display: none; }
  .run-menu button { text-align: left; height: 38px; padding: 0 12px; border: 0; border-radius: 8px;
    background: transparent; color: var(--fg); font-size: 14px; cursor: pointer; white-space: nowrap; }
  .run-menu button:hover { background: var(--surface-2); }
  .runbar .weekly { height: 44px; padding: 0 16px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); font-size: 14px;
    font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  .runbar .weekly:hover, .runbar .weekly:focus-visible { border-color: var(--sun); color: var(--sun); }
  @media (max-width: 640px) {
    .runbar { width: 100%; }
    .runbar select { flex: 1 1 120px; max-width: none; }
    .runsplit { flex: 1 1 100%; }
    .runsplit .run { flex: 1 1 auto; }
    .runbar .weekly { flex: 1 1 100%; justify-content: center; }
  }
  .runlog { position: fixed; right: 16px; bottom: 16px; z-index: 30; width: min(560px, calc(100% - 32px));
    max-height: 40vh; overflow: auto; margin: 0; padding: 12px 14px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
  .runlog .err { color: var(--warn); }
</style>
<div class="runbar">
  __PROFILE_CONTROL__
  <div class="runsplit">
    <button class="run" id="rb-run" type="button" data-i18n="app.run">▶ Run</button>
    <button class="run-caret" id="rb-more" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Run options" data-i18n-aria="app.runopts">▾</button>
    <div class="run-menu" id="rb-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-dry="0" data-i18n="app.run.normal">Run</button>
      <button type="button" role="menuitem" data-dry="1" data-i18n="app.run.dry">Dry run (don't write history)</button>
    </div>
  </div>
  <a class="weekly" href="__WEEKLY_HREF__"><span aria-hidden="true">📈</span><span data-i18n="app.weekly">Weekly</span></a>
</div>
<pre class="runlog" id="rb-log" hidden></pre>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var T = function (k) { return (window.skollT || function (x) { return x; })(k); };
  var timer = null;
  var prof = $("rb-profile");
  if (prof && prof.tagName === "SELECT") prof.onchange = function () {
    location.href = "/?profile=" + encodeURIComponent(this.value);
  };
  var runBtn = $("rb-run"), caret = $("rb-more"), menu = $("rb-menu");
  function menuOpen(open) {
    menu.hidden = !open; caret.setAttribute("aria-expanded", open ? "true" : "false");
  }
  function idle() {
    clearInterval(timer); timer = null;
    runBtn.disabled = false; caret.disabled = false; runBtn.textContent = T("app.run");
  }
  function poll() {
    fetch("/api/status").then(function (r) { return r.json(); }).then(function (s) {
      var log = $("rb-log");
      log.hidden = false;
      log.textContent = s.log.join("\n");
      log.scrollTop = log.scrollHeight;
      if (s.state === "running") return;
      idle();
      if (s.state === "done") { location.reload(); return; }
      var e = document.createElement("div");
      e.className = "err"; e.textContent = s.error; log.appendChild(e);
    });
  }
  function start(dry) {
    menuOpen(false);
    runBtn.disabled = true; caret.disabled = true; runBtn.textContent = T("app.running");
    fetch("/api/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profile: prof ? prof.value : "", dry_run: !!dry })
    }).then(function (r) { return r.json().then(function (d) { return [r.ok, d]; }); })
      .then(function (res) {
        if (!res[0]) {
          $("rb-log").hidden = false; $("rb-log").textContent = res[1].error || "error";
          idle(); return;
        }
        timer = setInterval(poll, 1000); poll();
      });
  }
  runBtn.onclick = function () { start(false); };
  caret.onclick = function (e) { e.stopPropagation(); menuOpen(menu.hidden); };
  Array.prototype.forEach.call(menu.querySelectorAll("button"), function (b) {
    b.onclick = function () { start(b.dataset.dry === "1"); };
  });
  document.addEventListener("click", function (e) {
    if (!menu.hidden && !menu.contains(e.target) && e.target !== caret) menuOpen(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !menu.hidden) { menuOpen(false); caret.focus(); }
  });
  document.addEventListener("skoll:lang", function () {
    if (!runBtn.disabled) runBtn.textContent = T("app.run");
  });
})();
</script>
